<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MCGOSH</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="home">
  <main class="house-stage" aria-label="MCGOSH home">
    <!-- The SVG keeps the clickable window areas locked to the photo at every screen size. -->
    <svg class="house-scene"
         viewBox="0 0 1208 1197"
         preserveAspectRatio="xMidYMid slice"
         role="img"
         aria-label="House with three clickable middle windows">
      <defs>
        <filter id="cinematic">
          <feColorMatrix type="matrix"
            values="
              0.64 0    0    0 0
              0    0.70 0    0 0
              0    0    0.78 0 0
              0    0    0    1 0"/>
          <feComponentTransfer>
            <feFuncR type="gamma" amplitude="1" exponent="1.08" offset="0"/>
            <feFuncG type="gamma" amplitude="1" exponent="1.08" offset="0"/>
            <feFuncB type="gamma" amplitude="1" exponent="1.05" offset="0"/>
          </feComponentTransfer>
        </filter>
        <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#000" stop-opacity=".22"/>
          <stop offset="58%" stop-color="#000" stop-opacity=".08"/>
          <stop offset="100%" stop-color="#000" stop-opacity=".38"/>
        </linearGradient>
      </defs>

      <image href="assets/house.jpg"
             width="1208"
             height="1197"
             preserveAspectRatio="none"
             filter="url(#cinematic)" />
      <rect width="1208" height="1197" fill="url(#shade)" pointer-events="none"/>

      <!-- Three center bay windows. All currently go to the same coming-soon page. -->
      <a href="coming-soon.html" aria-label="Open music coming soon page">
        <rect class="window-hotspot" x="355" y="458" width="78" height="125" rx="4"/>
      </a>
      <a href="coming-soon.html" aria-label="Open music coming soon page">
        <rect class="window-hotspot" x="437" y="450" width="82" height="133" rx="4"/>
      </a>
      <a href="coming-soon.html" aria-label="Open music coming soon page">
        <rect class="window-hotspot" x="522" y="444" width="84" height="139" rx="4"/>
      </a>
    </svg>
  </main>

  <section class="player" aria-label="Music player">
    <button class="play-button" id="playButton" type="button" aria-label="Play">
      <span id="playIcon">▶</span>
    </button>

    <div class="player-middle">
      <div class="track-line">
        <span id="trackName">Fast Track</span>
        <span id="time">0:00 / 0:00</span>
      </div>
      <input id="seek" class="seek" type="range" min="0" max="100" value="0" aria-label="Song position" />
    </div>

    <button class="mute-button" id="muteButton" type="button" aria-label="Mute">🔊</button>

    <!-- Drop your song into assets/song.mp3 -->
    <audio id="audio" preload="metadata">
      <source src="assets/song.mp3" type="audio/mpeg" />
    </audio>
  </section>

  <script src="app.js"></script>
</body>
</html>
